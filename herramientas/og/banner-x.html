<!-- ══ EL BANNER DE X ═════════════════════════════════════════════════════
     1500 × 500, que es lo que pide X para la cabecera del perfil.

     Es el mismo lockup con el que abre la web —el rombo y la palabra, una
     regla, y el epigrafe en monoespaciada— con la tipografia de verdad, no
     una imitacion: la hoja de fuentes es la que usa el sitio.

     Va todo CENTRADO y con la mitad de abajo despejada a proposito. X planta
     la foto de perfil sobre la esquina inferior izquierda y recorta los lados
     en el movil; lo que este ahi, o se tapa o se pierde.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden;background:#0A0D14}
  body{font-family:'Switzer','Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'DM Mono',ui-monospace,monospace}
</style>

<div style="position:relative;width:1500px;height:500px;overflow:hidden;
  background:
    radial-gradient(70% 120% at 50% -20%, #16203A 0%, rgba(22,32,58,0) 62%),
    radial-gradient(40% 90% at 84% 108%, #0E2A66 0%, rgba(14,42,102,0) 58%),
    #0A0D14;">

  <!-- la retícula tenue del sitio -->
  <div style="position:absolute;inset:0;opacity:.5;
    background-image:
      linear-gradient(90deg, rgba(232,236,244,.035) 0 1px, transparent 1px 100%),
      linear-gradient(180deg, rgba(232,236,244,.028) 0 1px, transparent 1px 100%);
    background-size:100px 100px,100px 100px"></div>

  <!-- las cuatro esquinas, como el encuadre de la portada -->
  <div style="position:absolute;inset:54px 64px;pointer-events:none">
    <i style="position:absolute;left:0;top:0;width:26px;height:26px;
      border-left:1px solid rgba(232,236,244,.20);border-top:1px solid rgba(232,236,244,.20)"></i>
    <i style="position:absolute;right:0;top:0;width:26px;height:26px;

    <i style="position:absolute;left:0;bottom:0;width:26px;height:26px;
      border-left:1px solid rgba(232,236,244,.20);border-bottom:1px solid rgba(232,236,244,.20)"></i>
    <i style="position:absolute;right:0;bottom:0;width:26px;height:26px;
      border-right:1px solid rgba(232,236,244,.20);border-bottom:1px solid rgba(232,236,244,.20)"></i>
  </div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;
              align-items:center;justify-content:center;padding-bottom:26px">

    <!-- el lockup: rombo + palabra, como abre la web -->
    <div style="display:flex;align-items:center;gap:26px">

      <div style="font-size:112px;font-weight:400;letter-spacing:-.052em;line-height:1;
                  transform:translateY(.012em);
                  background:linear-gradient(96deg,#FFFFFF 10%,#AFB4BF 96%);
                  -webkit-background-clip:text;background-clip:text;color:transparent">Nereum</div>
    </div>

    <div style="width:420px;height:1px;margin:38px 0 26px;
      background:linear-gradient(90deg,rgba(232,236,244,0),rgba(232,236,244,.28),rgba(232,236,244,0))"></div>

    <div class="mono" style="font-size:19px;letter-spacing:.30em;text-transform:uppercase;
