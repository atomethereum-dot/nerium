<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 672">
<style>
/* El plateado vive sobre fondo oscuro y ahi da 9,4:1. Sobre una pestana
   blanca cae a 2,13:1 y el simbolo se desdibuja, asi que en tema claro el
   degradado pasa a grafito del mismo tono azulado: 8,8:1 sobre blanco.
   Los cuadros azules no cambian, leen bien en los dos (4,5:1). */
.s0{stop-color:#EDF0F5}.s1{stop-color:#C2C9D6}.s2{stop-color:#98A1B2}.s3{stop-color:#79839A}
@media (prefers-color-scheme: light){
.s0{stop-color:#6E7789}.s1{stop-color:#4A5364}.s2{stop-color:#333B49}.s3{stop-color:#232935}
}
</style>
<defs><linearGradient id="plata" x1="0" y1="0" x2=".35" y2="1">
<stop offset="0" class="s0"/>
<stop offset=".42" class="s1"/>
<stop offset=".72" class="s2"/>
<stop offset="1" class="s3"/>
</linearGradient></defs>
<path fill="url(#plata)" d="M336 0 H464 V224 H672 V336 H560 V560 H464 V672 H336 A336 336 0 0 1 336 0 Z"/>
<rect fill="#2F6BFF" x="464" y="112" width="112" height="112"/>
<rect fill="#2F6BFF" x="560" y="336" width="112" height="112"/>
</svg>
