<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<!-- el color que la pagina pinta de verdad en la primera pantalla: el degradado
     del fondo arranca en #E4EDFF y lleva background-attachment:fixed, asi que
     --fondo (#F7F8FA) nunca entra en una ventana de movil. Declarar #F7F8FA
     dejaba una costura de dos tonos contra la barra de estado de iOS. -->
<meta name="theme-color" content="#E4EEFF">
<title>Nereum Explorer | The public record of the Network</title>
<meta name="description" content="Every block, every transfer and the policy attached to every asset on Nereum. Verifiable by anyone, with no account and no permission.">
<link rel="canonical" href="https://nereum.xyz/explorer/">

<!-- ══ iconos ══
     El SVG lo usan Chrome, Firefox, Edge y Safari 15+, y es el que manda: al
     ser vectorial no se pixela a ningun tamano. El .ico lleva SEIS medidas
     dentro (16 a 256) para Windows, marcadores y navegadores antiguos; el
     atributo sizes las declara de verdad, no "any", que le dice al navegador
     que escale una sola imagen y es lo que se veia borroso. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<!-- iOS no escoge por densidad, escoge por tamano declarado: dandole el suyo a
     cada aparato (iPhone 120, iPad 152, iPad Pro 167, y 180 como respaldo
     moderno) no reescala ninguno. Van transparentes, como el resto del juego:
     iOS los compone sobre negro en la pantalla de inicio, y sobre negro el
     plateado da 9,85:1. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png">
<!-- pestana anclada de Safari en macOS: silueta plana, el color lo pone el usuario -->
<link rel="mask-icon" href="/mask-icon.svg" color="#2F6BFF">
<link rel="manifest" href="/explorer/site.webmanifest">
<meta name="application-name" content="Nereum Explorer">
<meta name="apple-mobile-web-app-title" content="Explorer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- mosaico de Windows: solo lo miran IE11 y el Edge antiguo, pero no estorba -->
<meta name="msapplication-TileColor" content="#05070C">
<meta name="msapplication-TileImage" content="/mstile-150.png">

<!-- ══ vista previa al compartir el enlace ══
     La imagen va en ABSOLUTO: un scraper no resuelve rutas relativas. Mide
     2400x1260, el doble del 1200x630 de siempre, para que en una pantalla
     retina y en un monitor grande se vea nitida en vez de reescalada. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nereum">
<meta property="og:url" content="https://nereum.xyz/explorer/">
<meta property="og:title" content="Nereum Explorer | The public record of the Network">
<meta property="og:description" content="Every block, every transfer and the policy attached to every asset. Verifiable by anyone, with no account and no permission.">
<meta property="og:image" content="https://nereum.xyz/explorer/og.jpg?v=1">
<meta property="og:image:secure_url" content="https://nereum.xyz/explorer/og.jpg?v=1">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Nereum Explorer — the public record of the network">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nereum Explorer | The public record of the Network">
<meta name="twitter:description" content="Every block, every transfer and the policy attached to every asset. Verifiable by anyone, with no account and no permission.">
<meta name="twitter:image" content="https://nereum.xyz/explorer/og.jpg?v=1">
<meta name="twitter:image:alt" content="Nereum Explorer — the public record of the network">

<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{
  /* los mismos tokens que el sitio de nereum.xyz */
  --blue:#2F6BFF; --blue-lite:#79ABFF; --blue-d:#1B49E0; --blue-deep:#0A2564;
  --blue-l:rgba(47,107,255,.09);
  --paper:#FFFFFF; --paper2:#F2F3F5;
  --ink:#0A0C10; --ink-2:rgba(10,12,16,.62); --ink-3:rgba(10,12,16,.44);
  --linea:rgba(10,12,16,.13); --linea-2:rgba(10,12,16,.07);
  --fondo:#F7F8FA; --panel:#FFFFFF;
  --verde:#0B8A5C; --verde-l:rgba(11,138,92,.09);
  --rojo:#C7332F; --rojo-l:rgba(199,51,47,.08);
  --ambar:#9A6B12; --ambar-l:rgba(154,107,18,.09);
  --f:'Switzer','Inter Tight',system-ui,-apple-system,sans-serif;
  --tit:'Switzer','Inter Tight',system-ui,sans-serif;
  --m:'DM Mono',ui-monospace,monospace;
  --e-step:steps(4,end); --t1:.11s; --t2:.26s;
  --ease:cubic-bezier(.16,.84,.26,1);
  --sombra:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:var(--f);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;
  background:
    radial-gradient(1500px 640px at 50% -22%, #C4D7FF, transparent 64%),
    radial-gradient(820px 440px at 4% -8%, #B2C9FF, transparent 60%),
    radial-gradient(900px 700px at 96% 24%, #DCE6FA, transparent 62%),
    radial-gradient(1200px 900px at 30% 118%, #DFE7F7, transparent 60%),
    linear-gradient(180deg, #E4EDFF 0, #F0F3F9 640px, var(--fondo) 1300px);
  background-attachment:fixed}
#malla{position:fixed;inset:0;z-index:0;pointer-events:none;
  width:100%;height:100%;display:block}
/* una veladura extra sobre la cabecera, para que el azul llegue hasta arriba */
.hd{box-shadow:0 1px 0 rgba(47,107,255,.12)}
.hd,.wrap{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ══ cabecera ══ */
.hd{position:sticky;top:0;z-index:60;background:rgba(247,249,255,.66);
  backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid rgba(47,107,255,.13)}
.hd-in{max-width:1280px;margin:0 auto;padding:0 20px;height:60px;
  display:flex;align-items:center;gap:18px}
.marca{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.marca svg{width:20px;height:20px;color:var(--ink)}
.marca b{font-family:var(--tit);font-size:17px;font-weight:500;letter-spacing:-.01em}
.marca s{text-decoration:none;font-family:var(--m);font-size:9px;letter-spacing:.18em;
  border:1px solid var(--linea);color:var(--ink-3);padding:2px 7px;border-radius:3px}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{padding:7px 12px;border-radius:6px;font-size:14px;color:var(--ink-2);
  transition:background .18s var(--ease),color .18s var(--ease)}
.nav a:hover{background:var(--linea-2);color:var(--ink)}
.nav a.on{background:var(--blue-l);color:var(--blue);font-weight:500}
.hd-sp{flex:1}
.buscar{position:relative;flex:0 1 320px}
.buscar input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--linea);
  border-radius:9px;background:var(--linea-2);font-size:13.5px;outline:none;
  color:var(--ink);transition:border-color .18s var(--ease),background .18s var(--ease)}
.buscar input::placeholder{color:var(--ink-3)}
.buscar input:focus{background:var(--panel)}
.buscar input:focus{border-color:var(--blue)}
.buscar svg{position:absolute;left:11px;top:11px;width:14px;height:14px;
  fill:none;stroke:var(--ink-3);stroke-width:1.6}
/* el relleno sube EN CUATRO ESCALONES, como en el sitio */
.btn{position:relative;display:inline-flex;align-items:center;gap:7px;height:36px;
  padding:0 17px;border-radius:4px;background:var(--blue);color:#fff;
  font-size:13.5px;font-weight:500;overflow:hidden;isolation:isolate;
  transition:color var(--t1) var(--ease)}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--ink);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform var(--t2) var(--e-step)}
.btn:hover::before{transform:scaleY(1)}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:transparent;border:1px solid var(--linea);color:var(--ink);
  font-weight:500}
.btn.sec::before{background:var(--ink)}
.btn.sec:hover{color:#fff;border-color:var(--ink)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}
.menuB{display:none}

/* ══ estructura ══ */
.wrap{max-width:1280px;margin:0 auto;padding:26px 20px 80px}
h1{font-size:clamp(24px,2.6vw,32px);font-weight:500;letter-spacing:-.03em;
  margin-bottom:4px}
h2{font-size:16px;font-weight:500;letter-spacing:-.02em}
.sub{color:var(--ink-3);font-size:13.5px;margin-bottom:22px}
.miga{font-family:var(--m);font-size:11.5px;color:var(--ink-3);margin-bottom:14px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.miga a:hover{color:var(--blue)}

/* ══ tarjetas ══ */
.panel{background:rgba(255,255,255,.955);border:1px solid var(--linea);
  border-radius:13px;overflow:hidden;
  box-shadow:0 1px 2px rgba(10,12,16,.03),0 10px 30px rgba(47,107,255,.05)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--linea-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-b{padding:6px 0}
.rejilla{display:grid;gap:16px}
.r4{grid-template-columns:repeat(4,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:1fr 1fr}
.stat{background:rgba(255,255,255,.955);border:1px solid var(--linea);
  border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(10,12,16,.03),0 10px 30px rgba(47,107,255,.05)}
.stat::after{content:'';position:absolute;top:0;left:0;width:38px;height:2px;
  background:var(--blue)}
.stat i{display:block;font-family:var(--m);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);font-style:normal;margin-bottom:7px}
.stat b{display:block;font-size:27px;font-weight:500;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.stat s{text-decoration:none;font-size:12.5px;color:var(--ink-3)}

/* ══ movimiento ══ */
@keyframes sube{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes nueva{0%{background:rgba(47,107,255,.18)}100%{background:transparent}}
#app>*{animation:sube .26s var(--ease) both}
#app>*:nth-child(2){animation-delay:.02s}
#app>*:nth-child(3){animation-delay:.045s}
#app>*:nth-child(4){animation-delay:.07s}
#app>*:nth-child(5){animation-delay:.095s}
.tb tbody tr{animation:entra .22s var(--ease) both}
.tb tbody tr:nth-child(1){animation-delay:.008s}
.tb tbody tr:nth-child(2){animation-delay:.020s}
.tb tbody tr:nth-child(3){animation-delay:.032s}
.tb tbody tr:nth-child(4){animation-delay:.044s}
.tb tbody tr:nth-child(5){animation-delay:.056s}
.tb tbody tr:nth-child(6){animation-delay:.068s}
.tb tbody tr:nth-child(7){animation-delay:.080s}
.tb tbody tr:nth-child(8){animation-delay:.092s}
.tb tbody tr.rec{animation:entra .22s var(--ease) both, nueva 1.1s var(--ease)}
.stat b{transition:opacity .16s var(--ease)}
.stat b.cambia{opacity:.28}
.chk{animation:entra .2s var(--ease) both}
.chk:nth-child(2){animation-delay:.03s} .chk:nth-child(3){animation-delay:.06s}
.chk:nth-child(4){animation-delay:.09s} .chk:nth-child(5){animation-delay:.12s}
.chk:nth-child(6){animation-delay:.15s} .chk:nth-child(7){animation-delay:.18s}
.fila,.tb tbody tr,.nav a,.chip,.cop,.pie-col a{transition-duration:.11s !important}
@media(prefers-reduced-motion:reduce){#app>*,.tb tbody tr,.chk{animation:none}}

/* ══ tabla densa ══ */
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;padding:9px 18px;font-family:var(--m);font-size:10px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  border-bottom:1px solid var(--linea);white-space:nowrap;background:var(--linea-2)}
.tb th.d{text-align:right}
.tb td{padding:11px 18px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr{transition:background .14s var(--ease)}
.tb tbody tr:hover{background:var(--linea-2)}
.tb td.d{text-align:right;font-variant-numeric:tabular-nums}
.tb td.m{font-family:var(--m);font-size:12.5px}
.tb .p{color:var(--ink-3);font-size:12px}
.tb .n{font-weight:500}
.tbw{overflow-x:auto}
.tbw::-webkit-scrollbar{height:6px}
.tbw::-webkit-scrollbar-thumb{background:var(--linea);border-radius:3px}

/* ══ filas ══ */
.fila{display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--linea-2);transition:background .15s var(--ease)}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--linea-2)}
.fila .ic{border:1px solid var(--linea)}
.fila .ic{width:34px;height:34px;border-radius:9px;background:var(--linea-2);
  display:grid;place-items:center;flex:0 0 auto}
.fila .ic svg{width:15px;height:15px;fill:none;stroke:var(--ink-2);stroke-width:1.6}
.fila .pr{flex:1;min-width:0}
.fila .pr b{display:block;font-size:14px;font-weight:500}
.fila .pr s{text-decoration:none;display:block;font-size:12.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{text-align:right;flex:0 0 auto}
.fila .der b{display:block;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.fila .der s{text-decoration:none;font-size:12px;color:var(--ink-3)}
.mono{font-family:var(--m);font-size:12.5px}
.enl{color:var(--blue);text-decoration:none}
.enl:hover{text-decoration:underline;text-underline-offset:3px}

/* ══ etiquetas ══ */
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
  border-radius:5px;font-family:var(--m);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:500}
.tag.ok{background:var(--verde-l);color:var(--verde)}
.tag.no{background:var(--rojo-l);color:var(--rojo)}
.tag.esp{background:var(--ambar-l);color:var(--ambar)}
.tag.az{background:var(--blue-l);color:var(--blue)}
.tag.gr{background:var(--linea-2);color:var(--ink-2)}

/* ══ tabla de detalle ══ */
.det{width:100%;border-collapse:collapse}
.det tr{border-bottom:1px solid var(--linea-2)}
.det tr:last-child{border-bottom:0}
.det td{padding:12px 18px;vertical-align:top;font-size:14px}
.det td:first-child{width:210px;color:var(--ink-3);font-size:13.5px;
  font-family:var(--m);font-size:12px;letter-spacing:.04em}
.det td:last-child{word-break:break-word}

/* ══ formulario ══ */
.form{display:grid;gap:16px;padding:20px}
.campo label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.campo .ay{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:7px}
.campo input,.campo select,.campo textarea{width:100%;height:42px;padding:0 13px;
  border:1px solid var(--linea);border-radius:9px;background:var(--linea-2);
  font-size:14px;outline:none;color:var(--ink);
  transition:border-color .18s var(--ease),background .18s var(--ease)}
.campo input::placeholder{color:var(--ink-3)}
.campo select{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
    linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.campo textarea{height:auto;padding:10px 12px;resize:vertical;min-height:76px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--blue);
  background:var(--panel)}
.campo.mal input,.campo.mal select{border-color:var(--rojo)}
.err{display:none;font-size:12.5px;color:var(--rojo);margin-top:5px}
.campo.mal .err{display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border:1px solid var(--linea);border-radius:8px;font-size:13px;color:var(--ink-2);
  background:var(--linea-2);transition:all .18s var(--ease)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}

/* ══ pasos ══ */
.pasos{display:flex;gap:0;padding:16px 20px;border-bottom:1px solid var(--linea-2)}
.paso{flex:1;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-3)}
.paso i{width:26px;height:26px;border-radius:50%;border:1px solid var(--linea);
    background:var(--linea-2);
  display:grid;place-items:center;font-family:var(--m);font-size:11px;font-style:normal;
  flex:0 0 auto}
.paso.on{color:var(--ink);font-weight:500}
.paso.on i{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.paso.hecho i{background:var(--verde-l);border-color:var(--verde);color:var(--verde)}
.paso.hecho{color:var(--ink-2)}

/* ══ registro de comprobaciones ══ */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 18px;
  border-bottom:1px solid var(--linea-2);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk .b{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;
  place-items:center;margin-top:1px}
.chk .b svg{width:11px;height:11px;fill:none;stroke-width:2.4;stroke-linecap:round;
  stroke-linejoin:round}
.chk.ok .b{background:var(--verde-l)} .chk.ok .b svg{stroke:var(--verde)}
.chk.no .b{background:var(--rojo-l)}  .chk.no .b svg{stroke:var(--rojo)}
.chk.esp .b{background:var(--linea-2)} .chk.esp .b svg{stroke:var(--ink-3)}
.chk .t{flex:1}
.chk .t b{display:block;font-weight:500}
.chk .t s{text-decoration:none;color:var(--ink-3);font-size:12.5px}

/* ══ avisos ══ */
.aviso{padding:14px 18px;border-radius:9px;font-size:13.5px;line-height:1.55;
  display:flex;gap:11px;align-items:flex-start}
.aviso.ok{background:var(--verde-l);color:#0A6E4C}
.aviso.no{background:var(--rojo-l);color:#9B2626}
.aviso.inf{background:var(--blue-l);color:var(--blue-d)}
.aviso svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;fill:none;
  stroke:currentColor;stroke-width:1.8}

/* ══ punto vivo ══ */
.vivo{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)}
.vivo i{width:7px;height:7px;border-radius:50%;background:var(--verde);
  animation:lat 2s infinite}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}

.vacio{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.pie{margin-top:34px;padding-top:20px;border-top:1px solid var(--linea);
  font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:14px;
  flex-wrap:wrap}

.barra{height:6px;border-radius:3px;background:var(--linea-2);overflow:hidden;margin-top:7px}
.barra i{display:block;height:100%;background:var(--blue);transition:width .5s var(--ease)}

/* ══ móvil ══ */
@media(max-width:900px){
  .r4{grid-template-columns:1fr 1fr}
  .r3,.r2{grid-template-columns:1fr}
}
@media(max-width:720px){
  .hd-in{height:56px;gap:10px}
  .nav{display:none;position:fixed;top:56px;left:0;right:0;background:var(--panel);
    border-bottom:1px solid var(--linea);flex-direction:column;padding:8px;gap:2px;
    box-shadow:var(--sombra)}
  .nav.abierto{display:flex}
  .nav{background:var(--panel)}
  .nav a{padding:11px 14px}
  .menuB{display:grid;place-items:center;width:34px;height:34px;border-radius:7px;
    border:1px solid var(--linea)}
  .menuB svg{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:1.7}
.menuB{background:transparent}
  /* en la cabecera del móvil solo cabe la lupa: el campo se abre en un panel */
  .buscar{display:none}
  .hd .btn span{display:none}
  .hd .btn{padding:0 11px}
  .r4{grid-template-columns:1fr 1fr}
  .det td:first-child{width:auto;display:block;padding-bottom:2px}
  .det td:last-child{display:block;padding-top:0}
  .pasos{overflow-x:auto}
  .paso{flex:0 0 auto;padding-right:16px}
  .paso s{display:none}
  h1{font-size:20px}
}

/* ══ el pie ══ */
.pie{margin-top:46px;padding-top:30px;border-top:1px solid var(--linea);
  display:block;font-size:13.5px;color:var(--ink-3)}
.pie-top{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:30px;
  padding-bottom:28px}
.pie-marca svg{width:22px;height:22px;display:block;margin-bottom:11px}
.pie-marca b{display:block;font-size:14.5px;font-weight:500;color:var(--ink);
  margin-bottom:7px}
.pie-marca p{font-size:13px;line-height:1.6;max-width:38ch;margin-bottom:13px}
.pie-est{display:flex;gap:12px;align-items:center;font-size:11.5px}
.pie-col h6{font-family:var(--m);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);font-weight:500;margin-bottom:11px}
.pie-col a{display:block;padding:4px 0;font-size:13.5px;color:var(--ink-3);
  transition:color .16s var(--ease)}
.pie-col a:hover{color:var(--blue)}
.pie-bajo{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:16px 0 0;border-top:1px solid var(--linea-2);font-size:12.5px}

/* ══ la lupa ══ */
.lupa{display:none;place-items:center;width:36px;height:36px;border-radius:8px;
  border:1px solid var(--linea);flex:0 0 auto}
@media(max-width:720px){ .lupa{display:grid} }
.lupa svg{width:15px;height:15px;fill:none;stroke:var(--ink-2);stroke-width:1.7}
.velo{position:fixed;inset:0;z-index:90;background:rgba(10,12,16,.42);
  backdrop-filter:blur(6px);display:none;padding:76px 16px 16px}
.velo.on{display:block;animation:entra .22s var(--ease)}
.velo-c{max-width:620px;margin:0 auto;background:var(--panel);border-radius:12px;
  border:1px solid var(--linea);overflow:hidden;
  box-shadow:0 24px 60px rgba(10,12,16,.22)}
.velo-c input{width:100%;height:52px;padding:0 18px;border:0;font-size:16px;
  outline:none;background:transparent;color:var(--ink)}
.velo-c .ay{padding:11px 18px;border-top:1px solid var(--linea-2);
  font-size:12.5px;color:var(--ink-3)}

@media(max-width:900px){ .pie-top{grid-template-columns:1fr 1fr;gap:24px} }
@media(max-width:560px){ .pie-top{grid-template-columns:1fr;gap:22px} }

.cop{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;
  border:1px solid var(--linea);vertical-align:middle;margin-left:6px;
  transition:border-color .16s var(--ease),background .16s var(--ease)}
.cop:hover{border-color:var(--blue);background:var(--blue-l)}
.cop svg{width:12px;height:12px;fill:none;stroke:var(--ink-2);stroke-width:1.5}
.cop:hover svg{stroke:var(--blue)}
#graf{display:block;width:100%}

/* ══ gráficas ══ */
.chispa{display:block;width:100%;height:26px;margin-top:9px}
.ch-l{fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linejoin:round;
  stroke-linecap:round}
.ch-a{fill:rgba(47,107,255,.10);stroke:none}
.ch-p{fill:var(--blue)}
.bt{display:grid;grid-template-columns:1fr 2fr auto;gap:14px;align-items:center;
  padding:8px 0}
.bt-c{display:flex;align-items:center;gap:8px;min-width:0}
.bt-p{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.bt-c b{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.bt-c s{text-decoration:none;font-family:var(--m);font-size:11.5px;color:var(--ink-3);
  flex:0 0 auto}
.bt-b{height:7px;border-radius:4px;background:var(--linea-2);overflow:hidden}
.bt-b i{display:block;height:100%;border-radius:4px;
  animation:crece .5s var(--ease) both}
.bt-n{font-family:var(--m);font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
@keyframes crece{from{width:0 !important}}
.anillo{width:136px;height:136px}
.an-s{transition:opacity .12s var(--ease);cursor:default}
.anillo:hover .an-s{opacity:.42}
.anillo .an-s:hover{opacity:1}
.an-n{font-family:var(--f);font-size:24px;font-weight:500;fill:var(--ink)}
.an-t{font-family:var(--m);font-size:9px;fill:var(--ink-3);letter-spacing:.14em}
.gtip{position:fixed;z-index:80;pointer-events:none;opacity:0;
  background:var(--ink);color:#fff;border-radius:7px;padding:8px 11px;
  font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(10,12,16,.24);
  transition:opacity .1s var(--ease);white-space:nowrap}
.gtip.on{opacity:1}
.gtip b{display:block;font-family:var(--m);font-size:11px;margin-bottom:2px}
.gtip span{display:block;color:rgba(255,255,255,.72)}
.gtip span.no{color:#FF9A9A}
@media(max-width:900px){ .bt{grid-template-columns:1fr 1.4fr auto;gap:10px} }

/* ══ la cinta live ══ */
.cinta{position:sticky;top:60px;z-index:50;display:flex;align-items:center;
  height:38px;background:rgba(247,249,255,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(47,107,255,.12);overflow:hidden}
.cinta-e{flex:0 0 auto;padding:0 14px 0 max(20px,calc((100vw - 1280px)/2 + 20px));
  border-right:1px solid var(--linea-2);height:100%;display:flex;align-items:center}
.cinta-p{flex:1;overflow:hidden;height:100%;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent);
  mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent)}
.cinta-t{display:flex;align-items:center;height:100%;gap:0}
.ct-i{display:inline-flex;align-items:center;gap:7px;padding:0 14px;height:100%;
  border-right:1px solid var(--linea-2);white-space:nowrap;flex:0 0 auto;
  animation:ctIn .34s var(--ease) both}
.ct-i i{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.ct-i.no i{background:var(--rojo)}
.ct-i b{font-family:var(--m);font-size:11.5px;font-weight:400;color:var(--ink-2)}
.ct-i s{text-decoration:none;font-family:var(--m);font-size:11px;color:var(--ink-3)}
.ct-i u{text-decoration:none;font-size:11.5px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.ct-i:hover{background:rgba(47,107,255,.06)}
.ct-i.nuevo{animation:ctIn .34s var(--ease) both}
@keyframes ctIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@media(max-width:720px){
  .cinta{top:56px;height:34px}
  .cinta-e{padding-left:16px}
  .ct-i s{display:none}
}
@media(prefers-reduced-motion:reduce){ .ct-i{animation:none} }

/* ══ el anillo ══ */
.anillo{width:172px;height:172px;overflow:visible}
.an-g .an-s{transition:transform .16s var(--ease),opacity .12s var(--ease);
  transform-origin:80px 80px;
  filter:drop-shadow(0 2px 5px rgba(47,107,255,.22))}
.anillo:hover .an-s{opacity:.34}
.anillo .an-s:hover{opacity:1;transform:translate(var(--mx),var(--my)) scale(1.035)}
.an-n{font-family:var(--f);font-size:29px;font-weight:500;fill:var(--ink);
  letter-spacing:-.03em}
.an-t{font-family:var(--m);font-size:9px;fill:var(--ink-3);letter-spacing:.16em}
@keyframes anillIn{from{opacity:0;transform:rotate(-16deg) scale(.9)}
  to{opacity:1;transform:none}}
.an-g{animation:anillIn .5s var(--ease) both;transform-origin:80px 80px}

/* los encabezados de panel, con un punto de luz */
.panel-h{background:linear-gradient(180deg,rgba(47,107,255,.035),transparent)}

/* ══ la intro ══
   Un momento de marca de dos segundos: el símbolo se dibuja, los cuadrados
   entran en escalones y el nombre aparece. Se puede saltar tocando. */
.intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:
    radial-gradient(900px 520px at 50% 34%, #123A9E, transparent 70%),
    linear-gradient(180deg,#05070C,#0A1024);
  animation:introSale .5s var(--ease) 1.9s both}
.intro.fuera{display:none}
.intro-c{display:grid;place-items:center;gap:20px;text-align:center;padding:24px}
.intro-l{width:78px;height:78px;overflow:visible}
.il-p{opacity:0;transform:scale(.82) rotate(-8deg);transform-origin:336px 336px;
  animation:ilP .68s var(--ease) .1s both;
  filter:drop-shadow(0 8px 26px rgba(47,107,255,.5))}
.il-r{opacity:0;transform:translateY(-40px)}
.il-r1{animation:ilR .34s var(--ease) .62s both}
.il-r2{animation:ilR .34s var(--ease) .76s both}
@keyframes ilP{from{opacity:0;transform:scale(.82) rotate(-8deg)}
  to{opacity:1;transform:none}}
@keyframes ilR{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.intro-t b{display:block;font-size:clamp(28px,5vw,46px);font-weight:500;
  letter-spacing:-.035em;color:#fff;opacity:0;
  animation:introUp .5s var(--ease) .84s both}
.intro-t b span{color:#79ABFF}
.intro-t s{display:block;text-decoration:none;margin-top:9px;font-family:var(--m);
  font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,255,255,.5);opacity:0;
  animation:introUp .5s var(--ease) 1.0s both}
@keyframes introUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.intro-b{width:132px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);
  overflow:hidden;opacity:0;animation:introUp .3s var(--ease) 1.1s both}
.intro-b i{display:block;height:100%;width:0;background:#79ABFF;
  animation:introBar .8s var(--ease) 1.15s both}
@keyframes introBar{to{width:100%}}
@keyframes introSale{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){
  .intro{animation:introSale .3s linear .7s both}
  .il-p,.il-r,.intro-t b,.intro-t s,.intro-b,.intro-b i{animation:none;opacity:1;transform:none}
  .intro-b i{width:100%}
}

/* ══ la portada ══ */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;
  padding:14px 0 30px}
.hero-t .tag{margin-bottom:14px}
.hero-t h1{font-size:clamp(30px,4.2vw,50px);font-weight:500;letter-spacing:-.04em;
  line-height:1.05;margin-bottom:14px}
.hero-t h1 em{font-style:normal;color:var(--blue)}
.hero-t p{font-size:15.5px;color:var(--ink-2);max-width:46ch;line-height:1.6;
  margin-bottom:20px}
.hero-a{display:flex;gap:10px;flex-wrap:wrap}
.hero-c{background:rgba(255,255,255,.7);border:1px solid var(--linea);
  border-radius:14px;padding:16px;box-shadow:0 14px 44px rgba(47,107,255,.09)}
.cad-h{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:13px;font-family:var(--m);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.cadena{display:flex;align-items:stretch;overflow:hidden}
.cd-b{position:relative;flex:1;min-width:0;padding:12px 9px;border-radius:9px;
  background:var(--panel);border:1px solid var(--linea);margin-right:14px;
  text-align:center;transition:transform .14s var(--ease),border-color .14s var(--ease)}
.cd-b:last-child{margin-right:0}
.cd-b::after{content:'';position:absolute;right:-14px;top:50%;width:14px;height:1px;
  background:var(--linea)}
.cd-b:last-child::after{display:none}
.cd-b:hover{transform:translateY(-3px);border-color:var(--blue)}
.cd-b b{display:block;font-size:11.5px;font-weight:500;color:var(--ink);margin-bottom:7px}
.cd-p{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:16px;
  margin-bottom:7px}
.cd-p i{width:4px;height:4px;border-radius:1px;background:var(--blue)}
.cd-p i.no{background:var(--rojo)}
.cd-p i.v{background:var(--linea);width:14px}
.cd-b s{text-decoration:none;font-family:var(--m);font-size:9.5px;color:var(--ink-3)}
.cd-b.nuevo{animation:cdIn .3s var(--ease) both}
@keyframes cdIn{from{opacity:0;transform:translateX(22px) scale(.94)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:24px;padding-bottom:22px}
  .cd-b:nth-child(n+6){display:none}
}
@media(max-width:560px){ .cd-b:nth-child(n+5){display:none} }

/* ══ la fase de desarrollo, en el pie ══ */
.fase{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.fase b{font-family:var(--m);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue);font-weight:500;
  background:var(--blue-l);padding:4px 9px;border-radius:4px}
.fase-b{display:block;width:118px;height:5px;border-radius:3px;
  background:var(--linea-2);overflow:hidden;flex:0 0 auto}
.fase-b u{display:block;height:100%;border-radius:3px;text-decoration:none;
  background:linear-gradient(90deg,var(--blue-d),var(--blue));
  animation:crece .7s var(--ease) both}
.fase s{text-decoration:none;font-size:12.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
@media(max-width:560px){ .fase-b{width:96px} }

/* ══ la franja de testnet ══ */
.tnet{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;
  margin-bottom:16px;padding:14px 18px;border-radius:9px;
  background:var(--blue-l)}
.tnet-h{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.tnet-h b{font-size:19px;font-weight:500;letter-spacing:-.02em}
.tnet-l p{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:64ch;
  margin-bottom:13px}
.tnet-bar{height:7px;border-radius:4px;background:rgba(10,12,16,.10);overflow:hidden;
  margin-bottom:12px;max-width:520px}
.tnet-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--blue-d),var(--blue-lite));
  animation:crece .8s var(--ease) both}
.tnet-hit{display:flex;flex-wrap:wrap;gap:7px}
.hit{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:6px;font-size:12px;background:rgba(255,255,255,.8);
  border:1px solid rgba(47,107,255,.14);color:var(--ink-2)}
.hit em{font-style:normal;font-size:10px}
.hit.done{color:var(--verde);border-color:rgba(11,138,92,.28)}
.hit.curso{color:var(--blue);border-color:rgba(47,107,255,.32);
  background:rgba(47,107,255,.07)}
.hit.pend{color:var(--ink-3)}
.tnet-r{display:flex;gap:14px;flex:0 0 auto}
.tnet-n{padding:12px 16px;border-radius:9px;background:rgba(255,255,255,.8);
  border:1px solid rgba(47,107,255,.14);min-width:118px}
.tnet-n i{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);font-style:normal;margin-bottom:5px}
.tnet-n b{display:block;font-size:22px;font-weight:500;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.tnet-n s{text-decoration:none;font-size:11.5px;color:var(--ink-3)}
@media(max-width:900px){
  .tnet{grid-template-columns:1fr;gap:14px;padding:14px 18px}
  .tnet-r{width:100%}
  .tnet-n{flex:1;min-width:0}
}

/* ══ las listas del resumen ══
   Altura fija y sin barra: si el alto depende de las filas, el recuadro pega
   un salto cada vez que entra una transacción. */
/* la tabla no debe recalcular sus anchos con cada dato nuevo: si lo hace, las
   filas cambian de alto y el panel da un salto */
.tbw.fijo{overflow:hidden;height:342px}
.tb.mini{table-layout:fixed}
.tb.mini td{padding:10px 18px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tb.mini th{padding:8px 18px}
.tb.mini tbody tr{height:38px}
@media(max-width:900px){
  .tbw.fijo{height:auto}
  /* en móvil sobra la columna del "cuándo": el hash y el estado son lo que
     se mira, y con ella la tabla no cabía */
  .tb.mini th:last-child,.tb.mini td:last-child{display:none}
  .tb.mini td,.tb.mini th{padding-left:13px;padding-right:13px}
  .tb.mini .tag{font-size:9.5px;padding:0 6px}
  .tb.mini th:nth-child(1),.tb.mini td:nth-child(1){width:38%}
  .tb.mini th:nth-child(2),.tb.mini td:nth-child(2){width:28%}
  .tb.mini th:nth-child(3),.tb.mini td:nth-child(3){width:34%}
}
</style>
</head>

<header class="hd">

      <svg viewBox="0 0 672 672" aria-hidden="true">

          <stop offset="0" stop-color="#EDF0F5"/>

<div class="cinta" id="cinta" aria-hidden="true">

</div>
<canvas id="malla" aria-hidden="true"></canvas>
<div class="velo" id="velo">
  <div class="velo-c">
    <input id="qm" type="search" placeholder="Block, transaction, account or asset"
           autocomplete="off" spellcheck="false">
    <div class="ay">Enter a block number, a hash, an address or an asset name</div>
  </div>
</div>
<main class="wrap" id="app"></main>

<script>
/* ══════════════════════════════════════════════════════════════
   NEREUM EXPLORER · simulación completa
   Toda la cadena vive en memoria: bloques que se producen solos,
   transacciones, cuentas con credenciales y activos tokenizados
   con su política. Nada sale a la red.
   ══════════════════════════════════════════════════════════════ */

const RND=(s=>()=>((s=s*1664525+1013904223>>>0)/4294967296))(20260830);
const ent=(a,b)=>a+Math.floor(RND()*(b-a+1));
const elige=a=>a[Math.floor(RND()*a.length)];
const hex=n=>Array.from({length:n},()=>'0123456789abcdef'[Math.floor(RND()*16)]).join('');
const dir=()=>'nrm1'+hex(38);
const hash=()=>'0x'+hex(64);
const num=n=>n.toLocaleString('en-US');
const dec=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const corto=(s,a=10,b=8)=>s.length<=a+b+2?s:s.slice(0,a)+'…'+s.slice(-b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── el estado de la cadena ── */
/* la sociedad está en Miami, así que el peso está en Estados Unidos y el
   resto son países de habla inglesa */
const JUR=['United States','United States','United States','United Kingdom',
           'Canada','Ireland','Australia','New Zealand','Singapore','Switzerland'];
const CLASES=['Professional','Institutional','Qualified retail'];
const TIPOS=[
  {t:'Real estate', d:'A share in an income-producing property'},
  {t:'Private credit', d:'A loan secured against real collateral'},
  {t:'Invoice', d:'Commercial paper with a maturity'},
  {t:'Corporate debt', d:'A bond issued by a company'},
  {t:'Fund', d:'A share in an investment vehicle'}];

const CH={
  altura:0, bloques:[], txs:[], cuentas:[], activos:[], emisores:[],
  rechazos:0, arranque:Date.now()
};

function nuevaAccount(op={}){
  const c={
    dir: op.dir||dir(),
    nombre: op.nombre||null,
    tipo: op.tipo||'Holder',
    jur: op.jur||elige(JUR),
    clase: op.clase||elige(CLASES),
    credencial: op.credencial!==undefined?op.credencial:(RND()>0.18),
    emisorCred: elige(['Onfido','Sumsub','Jumio','Fractal ID']),
    caduca: new Date(Date.now()+ent(30,400)*864e5),
    saldo: +(RND()*180000).toFixed(2),
    tenencias: [],
    desde: Date.now()-ent(1,900)*864e5
  };
  CH.cuentas.push(c); return c;
}

function nuevoAsset(op={}){
  const ti=op.tipo||elige(TIPOS);
  const a={
    id:'NRA-'+String(CH.activos.length+1).padStart(4,'0'),
    simbolo: op.simbolo||('A'+hex(3).toUpperCase()),
    nombre: op.nombre||(ti.t+' · '+elige([
      'Miami, FL','Austin, TX','Denver, CO','Nashville, TN','Charlotte, NC',
      'Phoenix, AZ','Tampa, FL','Raleigh, NC','Columbus, OH','Boise, ID',
      'Savannah, GA','Reno, NV','Kansas City, MO','Salt Lake City, UT',
      'London','Manchester','Dublin','Toronto','Vancouver','Sydney',
      'Brisbane','Auckland','Singapore'])),
    tipo: ti.t, desc: op.desc||ti.d,
    emisor: op.emisor||elige(CH.emisores),
    suministro: op.suministro||ent(2,60)*1000,
    decimales: 2,
    valor: op.valor||ent(40,900)*1000,
    doc: op.doc||('Deed '+hex(6).toUpperCase()),
    huella: op.huella||hash(),
    politica: op.politica||{
      /* JUR repite Estados Unidos para darle peso al sortear cuentas; aquí hay
         que quitar los duplicados o la política los muestra dos veces */
      jur: [...new Set(JUR)].slice(0,ent(3,6)),
      classes: CLASES.slice(0,ent(1,3)),
      bloqueo: elige([0,30,90,180,365]),
      maxHolders: elige([50,100,250,500])
    },
    emitido: op.emitido||(Date.now()-ent(1,240)*864e5),
    titulares: [], transferencias: 0, rechazadas: 0,
    bloque: op.bloque||null
  };
  CH.activos.push(a); return a;
}

function nuevaTx(op){
  const t=Object.assign({
    hash: hash(), tipo:'Transfer', bloque:null, ts:Date.now(),
    de:null, a:null, activo:null, cantidad:0, estado:'ok',
    comprobaciones:[], comision:+(RND()*0.004+0.0006).toFixed(5), motivo:null
  }, op);
  CH.txs.unshift(t);
  if(t.estado==='no') CH.rechazos++;
  return t;
}

/* ── el motor de política: lo que decide si una transferencia liquida ── */
function comprueba(activo, de, a, cantidad){
  const c=[];
  c.push({n:'Valid signature', d:'The sending account controls the key', r:true});
  const saldo=(de.tenencias.find(x=>x.id===activo.id)||{}).cant||0;
  c.push({n:'Sufficient balance', d:`Holds ${dec(saldo)}, transferring ${dec(cantidad)}`,
          r: saldo>=cantidad});
  c.push({n:'Policy loaded', d:`Rule set for ${activo.id}`, r:true});
  c.push({n:'Recipient credential',
          d: a.credencial?`Verified by ${a.emisorCred}`:'No valid credential',
          r: a.credencial});
  const jurOk=activo.politica.jur.includes(a.jur);
  c.push({n:'Jurisdiction allowed',
          d: jurOk?`${a.jur} is in the policy`:`${a.jur} is not in the policy`,
          r: jurOk});
  const claseOk=activo.politica.classes.includes(a.clase);
  c.push({n:'Holder class',
          d: claseOk?`${a.clase} califica`:`${a.clase} does not qualify for this asset`,
          r: claseOk});
  const tit=activo.titulares.length + (a.tenencias.find(x=>x.id===activo.id)?0:1);
  const cupoOk=tit<=activo.politica.maxHolders;
  c.push({n:'Holder cap',
          d:`${tit} de ${activo.politica.maxHolders} allowed`, r:cupoOk});
  const pasa=c.every(x=>x.r);
  return {c, pasa, motivo: pasa?null:(c.find(x=>!x.r)||{}).n};
}

function mueve(activo, de, a, cantidad){
  const q=de.tenencias.find(x=>x.id===activo.id);
  q.cant-=cantidad; if(q.cant<=0.0001) de.tenencias=de.tenencias.filter(x=>x.id!==activo.id);
  const r=a.tenencias.find(x=>x.id===activo.id);
  if(r) r.cant+=cantidad; else a.tenencias.push({id:activo.id, cant:cantidad});
  activo.titulares=CH.cuentas.filter(x=>x.tenencias.some(y=>y.id===activo.id)).map(x=>x.dir);
  activo.transferencias++;
}

function nuevoBlock(txs){
  const b={
    n: ++CH.altura, hash: hash(), ts: Date.now(),
    validador: elige(CH.emisores).dir,
    txs: txs.map(t=>t.hash), gas: ent(21000, 340000),
    tam: ent(1200, 9800)
  };
  txs.forEach(t=>{ t.bloque=b.n; });
  CH.bloques.unshift(b);
  if(CH.bloques.length>240) CH.bloques.length=240;
  if(CH.txs.length>600) CH.txs.length=600;
  return b;
}

/* ── se siembra una cadena con historia ── */
(function siembra(){
  ['Sunbelt Property Trust','Lakeshore Credit Partners','Atlas Invoice Finance',
   'Meridian Capital Group','Blue Ridge Asset Management','Harborline Funding',
   'Cardinal Structured Credit','Great Lakes Realty Income'].forEach(nom=>{
    CH.emisores.push(nuevaAccount({nombre:nom, tipo:'Issuer', credencial:true,
      clase:'Institutional', jur:elige(['United States','United States',
        'United Kingdom','Canada','Ireland'])}));
  });
  for(let i=0;i<64;i++) nuevaAccount();
  for(let i=0;i<20;i++){
    const a=nuevoAsset();
    const n=ent(4,14);
    for(let k=0;k<n;k++){
      const c=elige(CH.cuentas.filter(x=>x.tipo==='Holder'));
      const cant=+(a.suministro/n*(0.5+RND())).toFixed(2);
      const t=c.tenencias.find(x=>x.id===a.id);
      if(t) t.cant+=cant; else c.tenencias.push({id:a.id, cant});
    }
    a.titulares=CH.cuentas.filter(x=>x.tenencias.some(y=>y.id===a.id)).map(x=>x.dir);
  }
  for(let i=0;i<150;i++){
    const lote=[];
    const cuantas=ent(0,4);
    for(let k=0;k<cuantas;k++) lote.push(txAleatoria());
    nuevoBlock(lote);
  }
})();

function txAleatoria(){
  const a=elige(CH.activos);
  const tenedores=CH.cuentas.filter(x=>x.tenencias.some(y=>y.id===a.id && y.cant>1));
  if(!tenedores.length) return nuevaTx({tipo:'Query', activo:a.id, estado:'ok',
    comprobaciones:[{n:'State read', d:'No change to the ledger', r:true}]});
  const de=elige(tenedores);
  /* la mayoría of transfers reales las gente que SÍ califica:
     eligiendo el receptor al azar salían casi todas rechazadas, que da una
     imagen falsa de la red */
  const todos=CH.cuentas.filter(x=>x.tipo==='Holder' && x.dir!==de.dir);
  const buenos=todos.filter(x=>x.credencial
    && a.politica.jur.includes(x.jur) && a.politica.classes.includes(x.clase));
  const a2 = (buenos.length && RND()<0.88) ? elige(buenos) : elige(todos);
  const disp=(de.tenencias.find(x=>x.id===a.id)||{}).cant||0;
  const cant=+(disp*(0.05+RND()*0.4)).toFixed(2);
  const {c,pasa,motivo}=comprueba(a,de,a2,cant);
  if(pasa) mueve(a,de,a2,cant); else a.rechazadas++;
  return nuevaTx({tipo:'Transfer', de:de.dir, a:a2.dir, activo:a.id,
    cantidad:cant, estado: pasa?'ok':'no', comprobaciones:c, motivo});
}


/* ══════════════════════════════════════════════════════════════
   FONDO · la misma rejilla del sitio
   Celdas cuyo turno sale de su distancia a un foco, así que la onda
   nace de un punto y se propaga en vez de encenderse toda a la vez.
   Va lentísima: es fondo, no espectáculo.
   ══════════════════════════════════════════════════════════════ */
(function(){
  const cv=document.getElementById('malla');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  const clm=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  let W=0,H=0,piezas=[],t0=performance.now();

  function arma(){
    const d=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    const cuantas=Math.round(clm(W/17, 40, 86));
    piezas=[];
    for(let i=0;i<cuantas;i++){
      piezas.push({
        x: Math.random()*W,
        t: Math.random(),                  /* por dónde va de su recorrido */
        v: 0.034+Math.random()*0.052,      /* velocidad de subida */
        w: 16+Math.random()*58,            /* tamaño */
        az: Math.random()>0.78,            /* una de cada cinco, en azul */
        p: 0.30+Math.random()*0.60         /* profundidad */
      });
    }
  }

  /* ── el vuelo ──
     Piezas de tinta que suben del canto inferior y salen por arriba: el mismo
     gesto que la transición del sitio. Las de delante van más rápidas y más
     opacas; las del fondo, lentas y casi transparentes. Sin retícula. */
  function pinta(now){
    const dt=Math.min((now-t0)/1000, .05); t0=now;
    ctx.clearRect(0,0,W,H);
    for(const q of piezas){
      q.t += q.v*dt*(0.55+q.p);
      if(q.t>1.16){ q.t=-0.16; q.x=Math.random()*W; }
      const y = H*1.08 - q.t*(H*1.26);
      const a = Math.sin(clm(q.t,0,1)*Math.PI) * q.p * 0.24;
      if(a<=0.002) continue;
      const l = q.w*(0.6+q.p*0.9);
      /* sin rotación: las piezas suben RECTAS. Con inclinación se veían
         torcidas y ensuciaban la retícula del contenido */
      ctx.fillStyle = q.az
        ? 'rgba(47,107,255,'+(a*1.6).toFixed(3)+')'
        : 'rgba(10,12,16,'+(a*0.62).toFixed(3)+')';
      /* redondeadas al píxel, o los bordes salen difuminados */
      ctx.fillRect(Math.round(q.x-l/2), Math.round(y-l*0.30),
                   Math.round(l), Math.round(l*0.60));
    }
    requestAnimationFrame(pinta);
  }

  arma();
  let tmp; addEventListener('resize', ()=>{ clearTimeout(tmp); tmp=setTimeout(arma,180); });
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    t0=performance.now(); requestAnimationFrame(pinta);
  }
})();

/* ── la cadena de bloques ──
   Los últimos siete enlazados. Cada uno entra por la derecha y empuja a los
   demás: se ve la cadena creciendo, que es lo que hace una cadena. */
function pinBloque(b,i){
  const t=CH.txs.filter(x=>x.bloque===b.n);
  const ok=t.filter(x=>x.estado==='ok').length;
  return `<a class="cd-b" href="#/block/${b.n}" style="--i:${i}">
    <b class="mono">${num(b.n)}</b>
    <div class="cd-p">${Array.from({length:Math.min(12,t.length)},(_,k)=>
      `<i class="${k<ok?'':'no'}"></i>`).join('')||'<i class="v"></i>'}</div>
    <s>${t.length} tx</s></a>`;
}
function armaCadena(){
  const c=document.getElementById('cadena'); if(!c) return;
  c.innerHTML=CH.bloques.slice(0,7).map(pinBloque).join('');
}
function empujaCadena(){
  const c=document.getElementById('cadena'); if(!c) return;
  const d=document.createElement('div');
  d.innerHTML=pinBloque(CH.bloques[0],0);
  const el=d.firstElementChild; el.classList.add('nuevo');
  c.prepend(el);
  while(c.children.length>7) c.lastElementChild.remove();
}

/* ── el contador que sube ── */
function sube(el, destino){
  if(!el) return;
  const de=parseInt((el.dataset.v||el.textContent).replace(/[^\d]/g,''),10)||0;
  if(de===destino){ el.textContent=num(destino); el.dataset.v=destino; return; }
  const t0=performance.now(), dur=420;
  const paso=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=num(Math.round(de+(destino-de)*e));
    if(k<1) requestAnimationFrame(paso); else el.dataset.v=destino;
  };
  requestAnimationFrame(paso);
}

/* ── la cinta ──
   Las últimas transferencias pasando bajo la cabecera. Es lo que que la
   red se sienta viva antes de leer nada. */
function pinCinta(t){
  const a=CH.activos.find(x=>x.id===t.activo);
  const ok=t.estado==='ok';
  return `<a class="ct-i ${ok?'':'no'}" href="#/tx/${t.hash}">
    <i></i><b>${corto(t.hash,8,4)}</b>
    <s>${a?esc(a.simbolo):'—'}</s>
    <u>${t.cantidad?dec(t.cantidad):'—'}</u></a>`;
}
function empujaCinta(){
  const c=document.getElementById('cintaT'); if(!c) return;
  const ult=CH.txs[0]; if(!ult) return;
  const d=document.createElement('div');
  d.innerHTML=pinCinta(ult);
  const el=d.firstElementChild; el.classList.add('nuevo');
  c.prepend(el);
  while(c.children.length>16) c.lastElementChild.remove();
}
function armaCinta(){
  const c=document.getElementById('cintaT'); if(!c) return;
  c.innerHTML=CH.txs.slice(0,14).map(pinCinta).join('');
}

/* ══ enrutado ══ */
const app=document.getElementById('app');
let RUTA='/';

function ir(r){ if(location.hash.slice(1)!==r) location.hash=r; else pinta(); }
function pinta(){
  RUTA=location.hash.slice(1)||'/';
  const [_,base,arg]=RUTA.split('/');
  document.querySelectorAll('.nav a').forEach(a=>
    a.classList.toggle('on', a.dataset.ir===('/'+(base||''))));
  const V={'':vOverview, assets:vAssets, asset:vAsset, blocks:vBlocks,
           block:vBlock, txs:vTxs, tx:vTx, accounts:vAccounts, account:vAccount,
           tokenize:vTokenize, transfer:vTransferir,
           validators:vValidators, network:vRed,
           rejected:vRejected, issuers:vIssuers};
  const f=V[base||''];
  app.innerHTML = f? f(arg?decodeURIComponent(arg):null) : vNoHay();
  window.scrollTo(0,0);
  if(document.getElementById('graf')){ dibujaGraf(); refrescaStatus(); armaCadena(); }
  document.querySelectorAll('[data-cop]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    navigator.clipboard?.writeText(b.dataset.cop);
    const o=b.innerHTML; b.innerHTML='<svg viewBox="0 0 20 20"><path d="M4 10l4 4 8-9"/></svg>';
    setTimeout(()=>b.innerHTML=o,1100);
  });
  document.getElementById('nav').classList.remove('abierto');
}
addEventListener('hashchange', pinta);

/* ══ piezas reutilizables ══ */
const ICO={
  bloque:'<path d="M10 2 L17 6 V14 L10 18 L3 14 V6 Z"/>',
  tx:'<path d="M4 7h12m-4-4 4 4-4 4M16 13H4m4 4-4-4 4-4"/>',
  activo:'<rect x="3" y="3" width="14" height="14" rx="2"/><path d="M7 10h6"/>',
  cuenta:'<circle cx="10" cy="7" r="3.2"/><path d="M4 17c0-3.3 2.7-5 6-5s6 1.7 6 5"/>',
  ok:'<path d="M4 10l4 4 8-9"/>', no:'<path d="M5 5l10 10M15 5L5 15"/>',
  esp:'<circle cx="10" cy="10" r="6"/>'
};
const ic=k=>`<div class="ic"><svg viewBox="0 0 20 20">${ICO[k]}</svg></div>`;
const cop=v=>`<button class="cop" data-cop="${esc(v)}" title="Copy" type="button">
  <svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.5"/>
  <path d="M13 5H5a1 1 0 0 0-1 1v8"/></svg></button>`;
const hace=ts=>{
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return `${s} s`;
  if(s<3600) return `${Math.floor(s/60)} min`;
  if(s<86400) return `${Math.floor(s/3600)} h`;
  return `${Math.floor(s/86400)} d`;
};
const miga=(...p)=>`<div class="miga">${p.map((x,i)=>
  (i?'<span>›</span>':'')+(x.r?`<a class="enl" href="#${x.r}">${esc(x.t)}</a>`:esc(x.t))
).join('')}</div>`;

function filaBlock(b){
  return `<tr onclick="ir('/block/${b.n}')" style="cursor:pointer">
    <td class="m n">${num(b.n)}</td>
    <td class="m">${corto(b.hash,10,8)}</td>
    <td>${b.txs.length}</td>
    <td class="m p">${corto(b.validador,8,6)}</td>
    <td class="d p">${num(b.gas)}</td>
    <td class="d p">${hace(b.ts)}</td>
  </tr>`;
}
/* ── versiones compactas ──
   En el resumen las dos tablas van a media pantalla: con seis o siete columnas
   no caben y sale una barra de desplazamiento. Estas llevan solo lo esencial. */
function tablaBlocksMini(bs){
  return `<div class="tbw fijo"><table class="tb mini">
    <thead><tr><th>Height</th><th class="d">Txs</th><th class="d">When</th></tr></thead>
    <tbody>${bs.map(b=>`<tr onclick="ir('/block/${b.n}')" style="cursor:pointer">
      <td class="m n">${num(b.n)}</td>
      <td class="d">${b.txs.length}</td>
      <td class="d p">${hace(b.ts)}</td></tr>`).join('')}</tbody></table></div>`;
}
function tablaTxsMini(ts){
  return `<div class="tbw fijo"><table class="tb mini">
    <thead><tr><th>Hash</th><th>Status</th><th class="d">Amount</th>
      <th class="d">When</th></tr></thead>
    <tbody>${ts.map(t=>{
      const a=CH.activos.find(x=>x.id===t.activo);
      return `<tr onclick="ir('/tx/${t.hash}')" style="cursor:pointer">
        <td class="m n">${corto(t.hash,8,4)}</td>
        <td><span class="tag ${t.estado==='ok'?'ok':'no'}">${t.estado==='ok'?'Settled':'Rejected'}</span></td>
        <td class="d">${t.cantidad?dec(t.cantidad):'—'}${a?' <span class="p">'+esc(a.simbolo)+'</span>':''}</td>
        <td class="d p">${hace(t.ts)}</td></tr>`;}).join('')}</tbody></table></div>`;
}

function tablaBlocks(bs){
  return `<div class="tbw"><table class="tb">
    <thead><tr><th>Altura</th><th>Hash</th><th>Txs</th><th>Validator</th>
      <th class="d">Gas</th><th class="d">When</th></tr></thead>
    <tbody>${bs.map(filaBlock).join('')}</tbody></table></div>`;
}
function filaTx(t){
  const a=CH.activos.find(x=>x.id===t.activo);
  return `<tr onclick="ir('/tx/${t.hash}')" style="cursor:pointer">
    <td class="m n">${corto(t.hash,10,6)}</td>
    <td><span class="tag ${t.estado==='ok'?'ok':'no'}">${t.estado==='ok'?'Settled':'Rejected'}</span></td>
    <td class="p">${esc(t.tipo)}</td>
    <td class="m">${a?esc(a.simbolo):'—'}</td>
    <td class="d">${t.cantidad?dec(t.cantidad):'—'}</td>
    <td class="d m p">${t.bloque?num(t.bloque):'—'}</td>
    <td class="d p">${hace(t.ts)}</td>
  </tr>`;
}
function tablaTxs(ts){
  return `<div class="tbw"><table class="tb">
    <thead><tr><th>Hash</th><th>Status</th><th>Type</th><th>Asset</th>
      <th class="d">Amount</th><th class="d">Block</th><th class="d">When</th></tr></thead>
    <tbody>${ts.map(filaTx).join('')}</tbody></table></div>`;
}
function filaAsset(a){
  return `<tr onclick="ir('/asset/${a.id}')" style="cursor:pointer">

/* ══ tokenizar: el flujo principal ══ */
const TOK={paso:1, datos:{jur:[], classes:[]}};

function vTokenize(){
  /* blindaje: si se entra a un paso avanzado sin haber pasado por los
     anteriores, faltan datos y el resumen reventaría */
  if(!TOK.datos) TOK.datos={jur:[],clases:[]};
  if(!Array.isArray(TOK.datos.jur)) TOK.datos.jur=[];
  if(!Array.isArray(TOK.datos.classes)) TOK.datos.classes=[];
  /* el resumen del paso 4 formatea números: si falta cualquiera de ellos hay
     que volver al principio en vez de reventar */
  const d0=TOK.datos;
  const completo1 = d0.nombre && d0.simbolo && d0.suministro>0 && d0.valor>0;
  const completo2 = completo1 && d0.doc && d0.custodio;
  const completo3 = completo2 && d0.maxHolders>0 && d0.bloqueo!==undefined;
  if(TOK.paso>=2 && !completo1) TOK.paso=1;
  if(TOK.paso>=3 && !completo2) TOK.paso=1;
  if(TOK.paso>=4 && !completo3) TOK.paso=1;
  const p=TOK.paso;
  const et=['Describe the asset','Attach documentation','Define the policy','Issue'];
  return `
  ${miga({t:'Explorer',r:'/'},{t:'Assets',r:'/assets'},{t:'Tokenize'})}
  <h1>Tokenize an asset</h1>
  <div class="sub">Four steps. When you finish, the asset exists on-chain with its policy bound to it.</div>

  <div class="panel">
    <div class="pasos">${et.map((e,i)=>`
      <div class="paso ${p===i+1?'on':''} ${p>i+1?'hecho':''}">
        <i>${p>i+1?'✓':i+1}</i><s>${e}</s></div>`).join('')}</div>
    <div id="tokCuerpo">${[vTok1,vTok2,vTok3,vTok4][p-1]()}</div>
  </div>

  ${yaTokenizados()}
  ${piePagina()}`;
}

function mal(id, si){ const e=document.getElementById(id); if(e)e.classList.toggle('mal', si); return si; }

function tokPaso1(){
  const d=TOK.datos;
  d.nombre=document.getElementById('f-nombre').value.trim();
  d.simbolo=document.getElementById('f-simbolo').value.trim().toUpperCase();
  d.tipo=document.getElementById('f-tipo').value;
  d.suministro=parseInt(document.getElementById('f-sum').value,10);
  d.valor=parseInt(document.getElementById('f-valor').value,10);
  let e=false;
  e=mal('c-nombre', d.nombre.length<3)||e;
  e=mal('c-simbolo', !/^[A-Z]{2,6}$/.test(d.simbolo))||e;
  e=mal('c-sum', !(d.suministro>0))||e;
  e=mal('c-valor', !(d.valor>0))||e;
  if(e) return;
  TOK.paso=2; pinta();
}
function tokPaso2(){
  const d=TOK.datos;
  d.doc=document.getElementById('f-doc').value.trim();
  d.custodio=document.getElementById('f-cust').value.trim();
  d.att=document.getElementById('f-att').value;
  let e=false;
  e=mal('c-doc', d.doc.length<3)||e;
  e=mal('c-cust', d.custodio.length<3)||e;
  if(e) return;
  TOK.paso=3; pinta();
}
function tokPaso3(){
  const d=TOK.datos;
  d.bloqueo=parseInt(document.getElementById('f-bloq').value,10);
  d.maxHolders=parseInt(document.getElementById('f-max').value,10);
  let e=false;
  e=mal('c-jur', d.jur.length===0)||e;
  e=mal('c-cla', d.classes.length===0)||e;
  e=mal('c-max', !(d.maxHolders>0))||e;
  if(e) return;
  TOK.paso=4; pinta();
}
function tokAtras(){ if(TOK.paso>1){ TOK.paso--; pinta(); } }
function tokJur(j){
  const a=TOK.datos.jur, i=a.indexOf(j);
  if(i<0) a.push(j); else a.splice(i,1);
  pinta();
}
function tokClase(c){
  const a=TOK.datos.classes, i=a.indexOf(c);
  if(i<0) a.push(c); else a.splice(i,1);
  pinta();
}
function tokEmite(){
  const d=TOK.datos;
  const em=CH.emisores[0];
  const a=nuevoAsset({
    nombre:d.nombre, simbolo:d.simbolo,
    tipo:TIPOS.find(t=>t.t===d.tipo)||TIPOS[0],
    desc:d.doc, emisor:em, suministro:d.suministro, valor:d.valor,
    doc:d.doc, huella:hash(), emitido:Date.now(),
    politica:{jur:d.jur.slice(), classes:d.classes.slice(),
              bloqueo:d.bloqueo, maxHolders:d.maxHolders}
  });
  em.tenencias.push({id:a.id, cant:a.suministro});
  a.titulares=[em.dir];
  const tx=nuevaTx({tipo:'Issuance', de:null, a:em.dir, activo:a.id,
    cantidad:a.suministro, estado:'ok',
    comprobaciones:[
      {n:'Emisor autorizado', d:esc(em.nombre)+' may issue on this network', r:true},
      {n:'Document referenciado', d:esc(d.doc)+' · custody: '+esc(d.custodio), r:true},
      {n:'Huella registrada', d:'Any later alteration will be detectable', r:true},
      {n:'Policy bound to the asset', d:d.jur.length+' jurisdictions · '+d.classes.length+' classes', r:true},
      {n:'Supply fijado', d:num(a.suministro)+' units, with no mint function', r:true}
    ]});
  const b=nuevoBlock([tx]);
  a.bloque=b.n;
  TOK.paso=1; TOK.datos={jur:[], classes:[]};
  location.hash='/asset/'+a.id;
}

function hazTransfer(id){
  const a=CH.activos.find(x=>x.id===id);
  const de=CH.cuentas.find(c=>c.dir===document.getElementById('t-de').value);
  const a2=CH.cuentas.find(c=>c.dir===document.getElementById('t-a').value);
  const cant=parseFloat(document.getElementById('t-cant').value);
  if(mal('c-cant', !(cant>0))) return;
  const {c,pasa,motivo}=comprueba(a,de,a2,cant);
  if(pasa) mueve(a,de,a2,cant); else a.rechazadas++;
  const tx=nuevaTx({tipo:'Transfer', de:de.dir, a:a2.dir, activo:a.id,
    cantidad:cant, estado: pasa?'ok':'no', comprobaciones:c, motivo});
  nuevoBlock([tx]);
  document.getElementById('resultado').innerHTML=`
    <div class="panel" style="margin-top:16px">
      <div class="panel-h"><h2>Result</h2>
        <span class="tag ${pasa?'ok':'no'}">${pasa?'Settled':'Rejected'}</span></div>
      <div class="aviso ${pasa?'ok':'no'}" style="margin:14px 18px;border-radius:9px">
        <svg viewBox="0 0 20 20">${pasa?ICO.ok:ICO.no}</svg>
        <div>${pasa
          ? '<strong>Settled.</strong> The asset changed hands in a single operation.'
          : `<strong>Rejected: ${esc(motivo)}.</strong> The transfer was not written, so there is nothing to reverse or reconcile.`}</div>
      </div>
      <div class="panel-b" style="padding:0">
        ${c.map(x=>`<div class="chk ${x.r?'ok':'no'}">
          <div class="b"><svg viewBox="0 0 20 20">${x.r?ICO.ok:ICO.no}</svg></div>
          <div class="t"><b>${esc(x.n)}</b><s>${esc(x.d)}</s></div></div>`).join('')}
      </div>
      <div style="padding:14px 18px;border-top:1px solid var(--linea-2)">
        <a class="btn sec" href="#/tx/${tx.hash}">View the transaction</a>
      </div>
    </div>`;
  document.getElementById('resultado').scrollIntoView({behavior:'smooth', block:'start'});
}

      ${orden.length?`<div class="tbw"><table class="tb">
        <thead><tr><th>Check that failed</th><th class="d">Veces</th>

/* ── minigráfica de una tarjeta ──
   Doce puntos con la evolución reciente. Es una pista de tendencia, no un
   gráfico para leer valores: por eso va sin ejes ni números. */
function chispa(k){
  const bs=CH.bloques.slice(0,12).reverse();
  let d=[];
  if(k==='alt') d=bs.map((b,i)=>i+1);
  else if(k==='rec') d=bs.map(b=>CH.txs.filter(x=>x.bloque===b.n&&x.estado==='no').length);
  else if(k==='act') d=bs.map((b,i)=>CH.activos.filter(a=>!a.bloque||a.bloque<=b.n).length);
  else d=bs.map(b=>CH.txs.filter(x=>x.bloque===b.n&&x.estado==='ok').length);
  if(!d.length) return '';
  const mx=Math.max(1,...d), mn=Math.min(...d);
  const W=100,H=26;
  const pts=d.map((v,i)=>[i/(d.length-1||1)*W, H-2-((v-mn)/((mx-mn)||1))*(H-5)]);
  const linea=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=linea+` L${W} ${H} L0 ${H} Z`;
  return `<svg class="chispa" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path class="ch-a" d="${area}"/><path class="ch-l" d="${linea}"/>
    <circle class="ch-p" cx="${pts[pts.length-1][0].toFixed(1)}"
      cy="${pts[pts.length-1][1].toFixed(1)}" r="2"/></svg>`;
}

/* ── el valor por tipo de activo ── */
function porType(){
  const m={};
  CH.activos.forEach(a=>{ m[a.tipo]=(m[a.tipo]||0)+a.valor });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
const TONOS=['#2F6BFF','#5B8BFF','#79ABFF','#A8C6FF','#0A2564','#98A1B2'];

function barrasType(){
  const t=porType(), tot=t.reduce((s,x)=>s+x[1],0)||1;
  return t.map(([k,v],i)=>`
    <div class="bt">
      <div class="bt-c"><span class="bt-p" style="background:${TONOS[i%TONOS.length]}"></span>
        <b>${esc(k)}</b><s>$${num(Math.round(v/1000))}k</s></div>
      <div class="bt-b"><i style="width:${(v/tot*100).toFixed(1)}%;
        background:${TONOS[i%TONOS.length]}"></i></div>
      <div class="bt-n">${(v/tot*100).toFixed(1)} %</div>
    </div>`).join('');
}

/* ── el anillo ──
   Con volumen: cada sector lleva su propio degradado, hay un halo detrás, un
   filo claro entre sectores y una sombra interior que hunde el centro. */
function anilloType(){
  const t=porType(), tot=t.reduce((s,x)=>s+x[1],0)||1;
  const R=62, r=39, cx=80, cy=80;
  const HUECO=0.018;
  let ang=-Math.PI/2, arcos='', defs='';
  t.forEach(([k,v],i)=>{
    const frac=v/tot;
    const a1=ang+HUECO, a2=ang+frac*Math.PI*2-HUECO;
    if(a2<=a1){ ang+=frac*Math.PI*2; return; }
    const gr=(a2-a1)>Math.PI?1:0;
    const p=(rad,a)=>[cx+Math.cos(a)*rad, cy+Math.sin(a)*rad];
    const [x1,y1]=p(R,a1), [x2,y2]=p(R,a2), [x3,y3]=p(r,a2), [x4,y4]=p(r,a1);
    const c=TONOS[i%TONOS.length];
    const gid='ag'+i;
    /* el degradado va en la dirección del sector, no siempre en vertical */
    const mx=Math.cos((a1+a2)/2), my=Math.sin((a1+a2)/2);
    defs+=`<linearGradient id="${gid}" x1="${(0.5-mx*0.5).toFixed(2)}"
      y1="${(0.5-my*0.5).toFixed(2)}" x2="${(0.5+mx*0.5).toFixed(2)}"
      y2="${(0.5+my*0.5).toFixed(2)}">
      <stop offset="0" stop-color="${c}" stop-opacity=".72"/>
      <stop offset="1" stop-color="${c}"/></linearGradient>`;
    arcos+=`<path class="an-s" fill="url(#${gid})"
      d="M${x1.toFixed(1)} ${y1.toFixed(1)}
         A${R} ${R} 0 ${gr} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}
         L${x3.toFixed(1)} ${y3.toFixed(1)}
         A${r} ${r} 0 ${gr} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z"
      style="--mx:${(mx*4).toFixed(2)}px;--my:${(my*4).toFixed(2)}px"
      ><title>${esc(k)} · ${(v/tot*100).toFixed(1)} %</title></path>`;
    ang+=frac*Math.PI*2;
  });
  return `<svg class="anillo" viewBox="0 0 160 160">
    <defs>${defs}
      <radialGradient id="halo"><stop offset=".55" stop-color="#2F6BFF" stop-opacity="0"/>
        <stop offset="1" stop-color="#2F6BFF" stop-opacity=".18"/></radialGradient>
      <radialGradient id="hueco"><stop offset=".62" stop-color="#0A0C10" stop-opacity=".10"/>
        <stop offset="1" stop-color="#0A0C10" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="80" cy="80" r="76" fill="url(#halo)"/>
    <g class="an-g">${arcos}</g>
    <circle cx="80" cy="80" r="39" fill="url(#hueco)"/>
    <text class="an-n" x="80" y="76" text-anchor="middle">${CH.activos.length}</text>
    <text class="an-t" x="80" y="94" text-anchor="middle">assets</text></svg>`;
}

/* ── la gráfica de actividad ──
   Transfers per block en los últimos cuarenta, con las rechazadas
   marcadas aparte. Se redibuja sola cuando llega un bloque. */
function dibujaGraf(){
  const cv=document.getElementById('graf'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const d=Math.min(devicePixelRatio||1,2);
  const W=cv.clientWidth, H=132;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,W,H);
  const bs=CH.bloques.slice(0,40).reverse();
  if(!bs.length) return;
  const datos=bs.map(b=>{
    const t=CH.txs.filter(x=>x.bloque===b.n);
    return {ok:t.filter(x=>x.estado==='ok').length, no:t.filter(x=>x.estado==='no').length};
  });
  const max=Math.max(3, ...datos.map(x=>x.ok+x.no));
  const w=W/datos.length, an=Math.max(3, w*0.56);
  /* la retícula de referencia, tres líneas nada más */
  ctx.strokeStyle='rgba(10,12,16,.07)'; ctx.lineWidth=1;
  for(let k=0;k<=2;k++){
    const y=Math.round(H-8-(H-24)*k/2)+.5;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  datos.forEach((v,i)=>{
    const x=i*w+(w-an)/2;
    const hOk=(H-24)*v.ok/max, hNo=(H-24)*v.no/max;
    if(hOk>0){ ctx.fillStyle='rgba(47,107,255,.85)';
      ctx.fillRect(x, H-8-hOk, an, hOk); }
    if(hNo>0){ ctx.fillStyle='rgba(199,51,47,.75)';
      ctx.fillRect(x, H-8-hOk-hNo, an, hNo); }
  });
  ctx.fillStyle='rgba(10,12,16,.42)';
  ctx.font='10px "DM Mono", monospace';
  ctx.fillText(String(max), 2, 12);

  /* el puntero: al pasar por encima se marca la barra y sale su detalle */
  cv.onmousemove=e=>{
    const R=cv.getBoundingClientRect();
    const i=Math.floor((e.clientX-R.left)/(R.width/datos.length));
    if(i<0||i>=datos.length) return;
    const b=bs[i], v=datos[i];
    let g=document.getElementById('grafTip');
    if(!g){ g=document.createElement('div'); g.id='grafTip'; g.className='gtip';
      document.body.appendChild(g); }
    g.innerHTML=`<b>Block ${num(b.n)}</b>
      <span>${v.ok} liquidada${v.ok===1?'':'s'}</span>
      ${v.no?`<span class="no">${v.no} rechazada${v.no===1?'':'s'}</span>`:''}`;
    g.style.left=Math.min(innerWidth-160, e.clientX+12)+'px';
    g.style.top=(e.clientY-52)+'px';
    g.classList.add('on');
  };
  cv.onmouseleave=()=>{ const g=document.getElementById('grafTip'); if(g)g.classList.remove('on'); };
}
function refrescaStatus(){
  const t=CH.txs.filter(x=>x.tipo==='Transfer');
  const no=t.filter(x=>x.estado==='no').length;
  const tpb=(CH.txs.filter(x=>x.bloque).length/Math.max(1,Math.min(CH.bloques.length,40))).toFixed(1);
  const e1=document.getElementById('rTpb'); if(e1)e1.textContent=tpb;
  const e2=document.getElementById('rRech');
